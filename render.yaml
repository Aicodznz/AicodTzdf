services:
  - type: web
    name: oilcom-super-app
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: OILCOM_HMAC_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
